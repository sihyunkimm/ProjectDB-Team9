name: Sync to Notion

on:
  push:
    branches:
      - main
    paths:
      - "reports/**/*.md"
  workflow_dispatch:
    inputs:
      files:
        description: "동기화할 보고서 경로 (쉼표 또는 개행 구분, 비우면 reports/ 전체)"
        required: false
        default: ""
      week:
        description: "PW 주차 번호 (선택, 제출 현황 DB 체크박스 갱신용)"
        required: false
        default: ""

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve target report files
        id: changed
        env:
          INPUT_FILES: ${{ inputs.files }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -z "$INPUT_FILES" ]; then
              FILES=$(find reports -type f -name '*.md' | sort)
              echo "[INFO] manual dispatch → reports/ 전체 ($(echo "$FILES" | grep -c . || true) 파일)"
            else
              FILES=$(printf '%s\n' "$INPUT_FILES" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | grep -v '^$' || true)
              echo "[INFO] manual dispatch → 입력 파일 사용"
            fi
          else
            FILES=$(git -c core.quotepath=false diff --name-only --diff-filter=ACMR HEAD~1 HEAD -- 'reports/**/*.md' || true)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Resolve week number
        id: week
        if: steps.changed.outputs.files != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_WEEK: ${{ inputs.week }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "week=$INPUT_WEEK" >> $GITHUB_OUTPUT
            echo "[INFO] manual dispatch → week: ${INPUT_WEEK:-(none)}"
            exit 0
          fi
          PR_NUM=$(printf '%s\n' "${{ github.event.head_commit.message }}" | grep -oE 'Merge pull request #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          if [ -z "$PR_NUM" ]; then
            PR_NUM=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq 'map(select(.merged_at != null))[0].number // empty' || true)
          fi
          if [ -z "$PR_NUM" ]; then
            echo "week=" >> $GITHUB_OUTPUT
            echo "[WARN] PR 번호를 찾지 못해 week를 비웁니다."
            exit 0
          fi
          # PR 코멘트에서 /week N 파싱 (마지막 매칭 사용)
          WEEK=$(gh pr view "$PR_NUM" --json comments --jq '.comments[].body' | grep -oP '/week\s+\K\d+' | tail -1 || true)
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "[INFO] PR #$PR_NUM → week: $WEEK"

      - name: Sync to Notion
        if: steps.changed.outputs.files != ''
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_PROJECT_DB_ID: ${{ secrets.NOTION_PROJECT_DB_ID }}
          NOTION_TRACKING_DB_ID: ${{ secrets.NOTION_TRACKING_DB_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          WEEK_NUMBER: ${{ steps.week.outputs.week }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          while IFS= read -r file; do
            if [ -z "$file" ]; then
              continue
            fi
            python scripts/sync_notion.py "$file"
          done <<< "$FILES"
